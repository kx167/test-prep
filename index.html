<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NIMCET Practice</title>
<style>
:root{--bg:#f4f5f9;--c:#fff;--t:#1b1d23;--m:#6b7280;--b:#e3e5ec;--a:#4f46e5;--g:#16a34a;--y:#d97706;--r:#dc2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--c:#181b22;--t:#eceef2;--m:#9198a8;--b:#2a2e38;--a:#818cf8;--g:#4ade80;--y:#fbbf24;--r:#f87171}}
:root[data-theme="dark"]{--bg:#0f1115;--c:#181b22;--t:#eceef2;--m:#9198a8;--b:#2a2e38;--a:#818cf8;--g:#4ade80;--y:#fbbf24;--r:#f87171}
*{box-sizing:border-box}html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--t);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:720px;margin:0 auto;padding:12px 14px 40px}
.top{display:flex;justify-content:space-between;align-items:center;padding:6px 0}
.nav{display:flex;gap:6px;overflow-x:auto;padding:6px 0 10px}
.tab{white-space:nowrap;border:1px solid var(--b);background:var(--c);color:var(--t);border-radius:999px;padding:8px 14px;font:inherit;cursor:pointer}
.tab.on{background:var(--a);border-color:var(--a);color:#fff}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:14px;margin:0 0 10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;flex-wrap:wrap}
.m{color:var(--m)}h2{margin:0 0 4px;font-size:1.3rem}
input,textarea{width:100%;font:inherit;padding:10px;margin:6px 0;border:1px solid var(--b);border-radius:8px;background:var(--bg);color:var(--t)}
input.in{width:130px;margin:0 4px 0 0;padding:6px}input[type=checkbox]{width:auto}
.btn{font:inherit;background:var(--a);color:#fff;border:0;border-radius:8px;padding:11px 16px;cursor:pointer;min-height:44px}
.btn.s{background:var(--c);color:var(--t);border:1px solid var(--b);padding:7px 12px;min-height:36px}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--a);outline-offset:2px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.chip{border:2px solid;border-radius:10px;padding:10px 14px;background:transparent;font:inherit;font-weight:600;cursor:pointer;min-height:44px}
.chip.easy{color:var(--g)}.chip.medium{color:var(--y)}.chip.hard{color:var(--r)}.chip:disabled{opacity:.35;cursor:default}
.opt{display:block;width:100%;text-align:left;font:inherit;color:var(--t);background:var(--bg);border:1px solid var(--b);border-radius:10px;padding:13px;margin:8px 0;cursor:pointer;min-height:44px}
.opt.sel{border-color:var(--a);background:var(--c);box-shadow:inset 0 0 0 1px var(--a)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px;margin-bottom:10px}
.num{font:inherit;color:var(--t);border:1px solid var(--b);background:var(--bg);border-radius:8px;min-height:44px;cursor:pointer}
.num.dn{background:var(--a);color:#fff;border-color:var(--a)}.num.cur{outline:2px solid var(--t)}
.bar{height:8px;background:var(--b);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--a)}
.fl{background:var(--c);border:1px solid var(--a);border-radius:10px;padding:10px;margin-bottom:10px}
.hero{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;border-radius:16px;padding:18px;margin:0 0 12px}.hero h2,.hero p{color:#fff;margin:0}.hero p{opacity:.9;margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stats div{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:10px;text-align:center}.stats b{display:block;font-size:1.25rem}.stats span{font-size:.75rem;color:var(--m)}
.sh{margin:20px 0 8px;font-size:1rem;border-left:4px solid var(--s);padding-left:10px}
.tg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tc{text-align:left;font:inherit;color:var(--t);background:var(--c);border:1px solid var(--b);border-top:4px solid var(--s);border-radius:12px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:124px;transition:transform .15s}
.tc:hover{transform:translateY(-2px);border-color:var(--s)}.ic{font-size:1.6rem}.tc small{color:var(--m)}.tc .bar{margin-top:auto}.tc .bar i{background:var(--s)}
.lv{display:block;width:100%;text-align:left;font:inherit;color:var(--t);background:var(--c);border:1px solid var(--b);border-left:6px solid;border-radius:12px;padding:14px;margin:0 0 10px;cursor:pointer;min-height:44px}.lv span{display:block;color:var(--m)}.lv.easy{border-left-color:var(--g)}.lv.medium{border-left-color:var(--y)}.lv.hard{border-left-color:var(--r)}.lv:disabled{opacity:.5;cursor:default}
.chat{max-height:50vh;overflow:auto;display:flex;flex-direction:column;gap:6px;margin:8px 0}.msg{max-width:80%;padding:8px 12px;border-radius:14px;background:var(--bg);align-self:flex-start}.msg.me{background:var(--a);color:#fff;align-self:flex-end}
select{width:100%;font:inherit;padding:10px;margin:6px 0;border:1px solid var(--b);border-radius:8px;background:var(--bg);color:var(--t)}
</style></head><body><div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SET=30,SB=supabase.createClient('https://wbnmzavadsjtnkjsleop.supabase.co','sb_publishable_Q4IYTZ6bTHwvQ-Xm_TNULA_uKvBAZo1');
let DB={qs:[],sq:[],at:[],rq:[],nt:[],rd:[],ms:[],users:[]},me=null,tab='',sub={},quiz=null,pv=null,msg='';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
const save=()=>{try{localStorage.setItem(K,JSON.stringify(DB))}catch(e){}};
const fl=()=>{const m=msg;msg='';return m?`<div class="fl">${esc(m)}</div>`:''};
const FMT=`Q: What is 2 + 2?
A) 3
B) 4
C) 5
D) 6
ANS: B
EXP: Add the two numbers.
---
LEVEL: Hard
Q: Your next question here
A) Option one  B) Option two  C) Option three  D) Option four
ANS: A`;
const SYL=[
['Mathematics','#6366f1',[
['Set Theory & Logic','🔣',["Sets & operations","Power sets & subsets","Cartesian product & cardinality","Functions & relations","Venn diagrams","Truth tables & connectives","Tautology & contradictions","De Morgan's Laws"]],
['Probability & Statistics','🎲',["Basic probability","Dependent & independent events","Conditional probability","Bayes' theorem","Mean, median, mode","Mean deviation, variance, standard deviation","Moments & frequency distributions"]],
['Algebra','➗',["Algebraic identities","Indices & factorization","Intervals & inequalities (wavy curve)","Equations in two variables","Quadratic equations","Arithmetic Progression (AP)","Geometric Progression (GP)","Harmonic Progression (HP)","AM, GM, HM relationships","Logarithms","Binomial theorem","Permutations & Combinations","Matrices & Determinants","Linear equations using matrices"]],
['Coordinate Geometry','📐',["Straight lines","Distance & section formula","Area of triangle","Circles","Parabola","Ellipse","Hyperbola"]],
['Calculus','📈',["Limits & continuity","Differentiation from first principles","Differentiation rules","Maxima, minima & rate of change","Indefinite integrals","Definite integrals","Integration by substitution","Integration by parts","Integration by partial fractions","Area under curves","Differential equations"]],
['Trigonometry','📏',["Functions & identities","Inverse trigonometric functions","Properties & solution of triangles","Heights & distances","Trigonometric equations"]],
['Vectors','➡️',["Vector algebra basics","Dot product","Cross product","Applications of vectors"]]]],
['Analytical Ability & Logical Reasoning','#0d9488',[
['Verbal & Non-verbal Reasoning','🧩',["Blood relations","Coding-decoding","Direction test","Mirror images","Alphanumeric series"]],
['Deductive & Inductive Reasoning','🧠',["Syllogisms","Statements & conclusions","Statements & arguments"]],
['Arrangements & Puzzles','🪑',["Seating arrangement","Puzzles","Input-output"]],
['Problem Solving & Data','📊',["Problem solving & critical thinking","Data interpretation","Numerical reasoning & data sufficiency","Data visualization"]]]],
['Computer Awareness','#d97706',[
['Computer Basics','💻',["CPU organization","Input devices","Output devices","Storage devices","Memory: RAM, ROM, cache"]],
['Data Representation','🔢',["Character, integer & fraction representation","Binary number system","Hexadecimal representation","Boolean logic"]],
['Computer Software','🖥️',["Operating systems","System software & drivers","Application software"]],
['Internet and Email','🌐',["How the internet works","Email basics","Online security awareness"]]]],
['General English','#db2777',[
['Vocabulary','📖',["Synonyms","Antonyms","One-word substitution","Idioms & phrases"]],
['Grammar','✍️',["Tenses","Articles & prepositions","Sentence correction","Sentence rearrangement"]],
['Reading & Comprehension','📚',["Reading comprehension passages","Inference-based questions"]]]]];
const ALLT=SYL.flatMap(x=>x[2].map(t=>t[0]));
const SUB=t=>(SYL.flatMap(x=>x[2]).find(y=>y[0]===t)||[0,0,[]])[2];
/* ---------- parsing and duplicate check ---------- */
const norm=s=>s.toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
const key=x=>norm(x.q)+'|'+x.o.map(norm).sort().join('|');
const jac=(a,b)=>{const A=new Set(norm(a).split(' ')),B=new Set(norm(b).split(' '));let i=0;A.forEach(w=>B.has(w)&&i++);return i/(A.size+B.size-i)};
function parse(t,dT,dL,dS){let T=dT||'',L=dL||'',items=[],errs=[];
 t.split(/^\s*---\s*$/m).forEach((blk,n)=>{let x={q:'',o:[],a:-1,e:''},any=0;
  blk.split('\n').forEach(l=>{l=l.trim();if(!l)return;let m;
   if(m=l.match(/^TOPIC:\s*(.+)/i))T=dT||m[1].trim();
   else if(m=l.match(/^LEVEL:\s*(\w+)/i))L=m[1].toLowerCase();
   else if(m=l.match(/^Q:\s*(.+)/i)){x.q=m[1];any=1}
   else if(m=l.match(/^ANS:\s*([A-D])/i))x.a='ABCD'.indexOf(m[1].toUpperCase());
   else if(m=l.match(/^EXP:\s*(.+)/i))x.e=m[1];
   else{const r=/([A-D])\)\s*(.*?)(?=\s+[A-D]\)\s|$)/g;let k;while(k=r.exec(l))x.o['ABCD'.indexOf(k[1])]=k[2].trim()}});
  if(!any)return;
  const bad=!x.q?'no question':![0,1,2,3].every(i=>x.o[i])?'needs 4 options A-D':x.a<0?'missing ANS':!ALLT.some(a=>a.toLowerCase()===T.toLowerCase())?'TOPIC must be a syllabus topic':!['easy','medium','hard'].includes(L)?'LEVEL must be easy, medium or hard':'';
  if(bad)errs.push('Block '+(n+1)+': '+bad);else items.push({...x,o:[0,1,2,3].map(i=>x.o[i]),topic:T,lvl:L,sb:dS})});
 return{items,errs}}
function prev(){const{items,errs}=parse($('#tx').value,sub.topic,$('#dl').value,sub.sb);const seen=DB.sq.map(q=>({k:key(q),q:q.q}));let ok=[],dup=0,near=[];
 items.forEach(x=>{const k=key(x);if(seen.some(s=>s.k===k)){dup++;return}
  const nb=seen.find(s=>jac(s.q,x.q)>=.85);seen.push({k,q:x.q});(nb?near:ok).push(x)});
 pv={ok,dup,near,errs,txt:$('#tx').value,dl:$('#dl').value};R()}
async function sv(){const inc=$('#nr')&&$('#nr').checked,add=pv.ok.concat(inc?pv.near:[]);
 const{data,error}=await SB.rpc('add_questions',{items:add.map(x=>({topic:x.topic,sub:x.sb,lvl:x.lvl,q:x.q,o:x.o,a:x.a,e:x.e,k:key(x)}))});
 msg=error?'Could not save: '+error.message:data.added+' questions saved, '+data.duplicates+' duplicates skipped. Users have been notified.';pv=null;await load();await loadSub();R()}
const smp=()=>{$('#tx').value=FMT};
async function del(id){await SB.from('questions').delete().eq('id',id);await load();await loadSub();R()}
/* ---------- data + auth (Supabase) ---------- */
async function pg(f){let o=[],i=0;for(;;){const{data,error}=await f().range(i,i+999);if(error)throw error;o=o.concat(data);if(data.length<1000)return o;i+=1000}}
async function load(){try{const adm=me.role==='admin';
 const[q,a,r,n,d,m,u]=await Promise.all([
  pg(()=>SB.from('questions').select('id,topic,sub,lvl').order('id')),
  pg(()=>SB.from('attempts').select('id,topic,sub,lvl,set_no,qids,ans,score,total').eq('user_id',me.id).order('id')),
  pg(()=>{const x=SB.from('key_requests').select('id,user_id,topic,sub,lvl,set_no,status').order('id');return adm?x:x.eq('user_id',me.id)}),
  pg(()=>SB.from('notifications').select('id,title,body,created_at').order('id',{ascending:false})),
  pg(()=>SB.from('notification_reads').select('notification_id').order('notification_id')),
  pg(()=>SB.from('messages').select('id,thread_user,sender,body').order('id')),
  pg(()=>SB.from('profiles').select('id,username,role,is_active').order('username'))]);
 const nm={};u.forEach(x=>nm[x.id]=x.username);
 DB.users=u.map(x=>({id:x.id,u:x.username,role:x.role,on:x.is_active}));
 DB.qs=q.map(x=>({id:x.id,topic:x.topic,sb:x.sub,lvl:x.lvl}));
 DB.at=a.map(x=>({id:x.id,u:me.u,topic:x.topic,sb:x.sub,lvl:x.lvl,set:x.set_no,qids:x.qids,ans:x.ans,score:x.score,total:x.total}));
 DB.rq=r.map(x=>({id:x.id,uid:x.user_id,u:nm[x.user_id]||me.u,topic:x.topic,sb:x.sub,lvl:x.lvl,set:x.set_no,st:x.status}));
 DB.nt=n.map(x=>({id:x.id,t:x.title,b:x.body,ts:Date.parse(x.created_at)}));
 DB.rd=d.map(x=>x.notification_id);
 DB.ms=m.map(x=>({id:x.id,th:x.thread_user,from:x.sender,body:x.body}))}
 catch(e){msg='Could not load data: '+e.message}}
async function loadSub(){const{data}=await SB.from('questions').select('id,lvl,q,o,question_answers(a,e)').eq('topic',sub.topic).eq('sub',sub.sb).order('id').limit(1000);
 DB.sq=(data||[]).map(x=>({id:x.id,lvl:x.lvl,q:x.q,o:x.o,a:([].concat(x.question_answers||[])[0]||{}).a}))}
async function fn(b){const{error}=await SB.functions.invoke('admin-users',{body:b});if(!error)return '';let m=error.message;try{m=(await error.context.json()).error||m}catch(e){}return m}
async function boot(uid){const{data:p}=await SB.from('profiles').select('username,role,is_active').eq('id',uid).maybeSingle();
 if(!p||!p.is_active){await SB.auth.signOut();me=null;msg='This account is disabled or not set up. Ask the admin.';R();return}
 me={id:uid,u:p.username,role:p.role};tab=p.role==='admin'?'add':'prac';sub={};await load();R()}
async function login(){const{data,error}=await SB.auth.signInWithPassword({email:$('#lu').value.trim().toLowerCase()+'@nimcet.app',password:$('#lp').value});
 if(error){msg='Wrong ID or password.';R();return}await boot(data.user.id)}
async function out(){await SB.auth.signOut();me=null;quiz=null;sub={};R()}
async function go(t){tab=t;sub={};quiz=null;pv=null;await load();R()}
async function chp(){const v=$('#cp').value;if(v.length<6)msg='Use at least 6 characters.';else{const{error}=await SB.auth.updateUser({password:v});msg=error?error.message:'Password updated.'}R()}
async function addU(){const e=await fn({action:'create',username:$('#nu').value,password:$('#np').value});msg=e||'User created.';if(!e)await load();R()}
async function rst(i){const e=await fn({action:'reset',id:DB.users[i].id,password:$('#rp'+i).value});msg=e||'Password reset for '+DB.users[i].u+'.';R()}
async function tog(i){await SB.from('profiles').update({is_active:!DB.users[i].on}).eq('id',DB.users[i].id);await load();R()}
async function dec(id,st){const r=DB.rq.find(x=>x.id===id);
 await SB.from('key_requests').update({status:st,decided_at:new Date().toISOString()}).eq('id',id);
 await SB.from('notifications').insert({to_user:r.uid,title:'Answer key '+st,body:r.sb+' · '+r.lvl+' · Set '+(r.set+1)});await load();R()}
async function ann(){const t=$('#at').value.trim(),b=$('#ab').value.trim();if(!t){msg='Add a title.';R();return}
 const{error}=await SB.from('notifications').insert({title:t,body:b});msg=error?error.message:'Announcement sent.';await load();R()}

/* ---------- views ---------- */
function loginV(){return `<div class="card" style="max-width:360px;margin:10vh auto"><h2>NIMCET Practice</h2>${fl()}<input id="lu" placeholder="User ID" autocomplete="username"><input id="lp" type="password" placeholder="Password" autocomplete="current-password"><button class="btn" onclick="login()">Log in</button></div>`}
function unread(){return DB.nt.filter(n=>!DB.rd.includes(n.id)).length}
function head(){const T=me.role==='admin'?[['add','Questions'],['users','Users'],['req','Key requests'],['chat','Chat'],['ann','Announce'],['acc','Account']]:[['prac','Practice'],['prog','Progress'],['chat','Chat'],['nt','Alerts'+(unread()?' ('+unread()+')':'')],['acc','Account']];
 return `<div class="top"><b>NIMCET Practice</b><span>${esc(me.u)} <button class="btn s" onclick="out()">Log out</button></span></div><div class="nav">${T.map(t=>`<button class="tab${tab===t[0]?' on':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('')}</div>`+fl()}
function addV(){return sub.sb?admTopicV():sub.topic?admStV():admHomeV()}
function admHomeV(){return `<div class="hero"><h2>Add questions by topic</h2><p>${DB.qs.length} questions in the bank. Tap a topic to add or manage its questions.</p></div>`+SYL.map(x=>`<h3 class="sh" style="--s:${x[1]}">${x[0]}</h3><div class="tg">${x[2].map(t=>{const c=l=>DB.qs.filter(q=>q.topic===t[0]&&q.lvl===l).length;return `<button class="tc" style="--s:${x[1]}" onclick="pt(${ALLT.indexOf(t[0])})"><span class="ic">${t[1]}</span><b>${t[0]}</b><small>Easy ${c('easy')} · Medium ${c('medium')} · Hard ${c('hard')}</small></button>`}).join('')}</div>`).join('')}
function admStV(){const t=sub.topic;return `<button class="btn s" onclick="sub={};R()">All topics</button><div class="hero"><h2>${esc(t)}</h2><p>Choose a sub-topic to add questions</p></div>`+SUB(t).map((n,j)=>{const c=l=>DB.qs.filter(q=>q.topic===t&&q.sb===n&&q.lvl===l).length;return `<button class="lv" style="border-left-color:var(--a)" onclick="ps(${j})"><b>${esc(n)}</b><span>Easy ${c('easy')} · Medium ${c('medium')} · Hard ${c('hard')}</span></button>`}).join('')}
function admTopicV(){const t=sub.sb,L=DB.sq;let p='';
 if(pv)p=`<div class="card"><b>Preview</b><p>${pv.ok.length} new · ${pv.dup} exact duplicates removed · ${pv.near.length} near-duplicates · ${pv.errs.length} errors</p>${pv.errs.map(e=>`<div class="m">${esc(e)}</div>`).join('')}${pv.near.map(x=>`<div class="m">Near-duplicate: ${esc(x.q)}</div>`).join('')}${pv.near.length?'<label><input type="checkbox" id="nr"> Also add near-duplicates</label><br>':''}<button class="btn" onclick="sv()">Save ${pv.ok.length} questions</button></div>`;
 return `<button class="btn s" onclick="sub={topic:sub.topic};pv=null;R()">Back to sub-topics</button><div class="hero"><h2>${esc(t)}</h2><p>${esc(sub.topic)} · ${L.length} questions</p></div><div class="card"><b>Add questions</b><p class="m">Paste any number of questions and separate them with ---. Add a LEVEL: line inside the text to switch difficulty.</p><select id="dl">${['easy','medium','hard'].map(l=>`<option value="${l}"${pv&&pv.dl===l?' selected':''}>Default level: ${l}</option>`).join('')}</select><textarea id="tx" rows="10" placeholder="Q: ...">${esc(pv?pv.txt:'')}</textarea><button class="btn s" onclick="smp()">Show format</button> <button class="btn" onclick="prev()">Preview</button></div>${p}<div class="card"><b>Questions in this sub-topic</b>${L.map(q=>`<div class="row"><span>${q.lvl} · ${esc(q.q.slice(0,60))}</span><span>Answer ${'ABCD'[q.a]} <button class="btn s" onclick="del(${q.id})">Delete</button></span></div>`).join('')||'<p class="m">No questions yet.</p>'}</div>`}
function usersV(){return `<div class="card"><b>Create user</b><input id="nu" placeholder="User ID"><input id="np" placeholder="Password (min 6 characters)"><button class="btn" onclick="addU()">Create user</button></div><div class="card">${DB.users.map((u,i)=>`<div class="row"><span>${esc(u.u)} <small class="m">${u.role}${u.on?'':' · disabled'}</small></span>${u.role==='admin'?'':`<span><input class="in" id="rp${i}" placeholder="New password"><button class="btn s" onclick="rst(${i})">Set</button> <button class="btn s" onclick="tog(${i})">${u.on?'Disable':'Enable'}</button></span>`}</div>`).join('')}</div>`}
function reqV(){const p=DB.rq.filter(r=>r.st==='pending');return `<div class="card"><b>Pending requests (${p.length})</b>${p.map(r=>`<div class="row"><span>${esc(r.u)}: ${esc(r.sb)} · ${r.lvl} · Set ${r.set+1}</span><span><button class="btn s" onclick="dec(${r.id},'approved')">Approve</button> <button class="btn s" onclick="dec(${r.id},'rejected')">Reject</button></span></div>`).join('')||'<p class="m">Nothing waiting.</p>'}</div>`}
const annV=()=>`<div class="card"><b>Send announcement</b><input id="at" placeholder="Title"><textarea id="ab" rows="3" placeholder="Message"></textarea><button class="btn" onclick="ann()">Send to all users</button></div>`;
const accV=()=>`<div class="card"><b>Change password</b><input id="cp" type="password" placeholder="New password (min 6 characters)"><button class="btn" onclick="chp()">Update password</button></div>`;
function bank(){return DB.qs.filter(q=>q.topic===sub.topic&&q.sb===sub.sb&&q.lvl===sub.lvl)}
const pt=i=>{sub={topic:ALLT[i]};R()};
const pl=l=>{sub.lvl=l;R()};
async function ps(j){sub.sb=SUB(sub.topic)[j];if(me.role==='admin')await loadSub();R()}
const rq=s=>DB.rq.filter(r=>r.u===me.u&&r.topic===sub.topic&&r.sb===sub.sb&&r.lvl===sub.lvl&&r.set===s).pop();
const avg=m=>m.length?Math.round(m.reduce((x,a)=>x+a.score/a.total,0)/m.length*100):0;
function pracV(){if(quiz)return quizV();if(sub.res)return resV();if(sub.lvl)return setsV();if(sub.sb)return lvlV();if(sub.topic)return stV();return homeV()}
function homeV(){const m=DB.at.filter(a=>a.u===me.u);
 return `<div class="hero"><h2>Hi ${esc(me.u)}, pick a topic</h2><p>Every NIMCET topic in one place. Tap a topic to practise only its questions.</p></div><div class="stats"><div><b>${m.reduce((x,a)=>x+a.total,0)}</b><span>answered</span></div><div><b>${avg(m)}%</b><span>average score</span></div><div><b>${new Set(m.map(a=>a.topic)).size}/${ALLT.length}</b><span>topics started</span></div></div>`
 +SYL.map(x=>`<h3 class="sh" style="--s:${x[1]}">${x[0]}</h3><div class="tg">${x[2].map(t=>{const n=DB.qs.filter(q=>q.topic===t[0]).length,mm=m.filter(a=>a.topic===t[0]),v=avg(mm);
  return `<button class="tc" style="--s:${x[1]}" onclick="pt(${ALLT.indexOf(t[0])})"><span class="ic">${t[1]}</span><b>${t[0]}</b><small>${n} questions${mm.length?' · avg '+v+'%':''}</small><div class="bar"><i style="width:${v}%"></i></div></button>`}).join('')}</div>`).join('')}
function stV(){const t=sub.topic,m=DB.at.filter(a=>a.u===me.u&&a.topic===t);
 return `<button class="btn s" onclick="sub={};R()">All topics</button><div class="hero"><h2>${esc(t)}</h2><p>Choose a sub-topic to practise</p></div>`+SUB(t).map((n,j)=>{const c=DB.qs.filter(q=>q.topic===t&&q.sb===n).length,mm=m.filter(a=>a.sb===n);return `<button class="lv" style="border-left-color:var(--a)" onclick="ps(${j})"><b>${esc(n)}</b><span>${c} questions${mm.length?' · avg '+avg(mm)+'%':''}</span></button>`}).join('')}
function lvlV(){const t=sub.sb,n0=DB.qs.filter(q=>q.topic===sub.topic&&q.sb===t).length;
 return `<button class="btn s" onclick="sub={topic:sub.topic};R()">Back to sub-topics</button><div class="hero"><h2>${esc(t)}</h2><p>${esc(sub.topic)} · ${n0} questions · ${DB.at.filter(a=>a.u===me.u&&a.sb===t).length} attempts</p></div>`+['easy','medium','hard'].map(l=>{const n=DB.qs.filter(q=>q.topic===sub.topic&&q.sb===t&&q.lvl===l).length;return `<button class="lv ${l}" ${n?`onclick="pl('${l}')"`:'disabled'}><b>${l[0].toUpperCase()+l.slice(1)}</b><span>${n?n+' questions · '+Math.ceil(n/SET)+' set(s) of up to '+SET:'No questions yet'}</span></button>`}).join('')}
function setsV(){const b=bank(),n=Math.ceil(b.length/SET);let h=`<button class="btn s" onclick="sub={topic:sub.topic,sb:sub.sb};R()">Back to difficulty</button><div class="card"><h2>${esc(sub.sb)}</h2><span class="m">${esc(sub.topic)} · ${sub.lvl}</span></div>`;
 for(let s=0;s<n;s++){const A=DB.at.filter(a=>a.u===me.u&&a.topic===sub.topic&&a.sb===sub.sb&&a.lvl===sub.lvl&&a.set===s),best=A.length?Math.max(...A.map(a=>Math.round(a.score/a.total*100))):null,r=rq(s);
  h+=`<div class="card"><div class="row"><b>Set ${s+1}</b><span class="m">${Math.min(SET,b.length-s*SET)} questions · ${A.length} attempts${best!==null?' · best '+best+'%':''}</span></div><button class="btn" onclick="st(${s})">${A.length?'Retake set':'Start set'}</button>${A.length?` <button class="btn s" onclick="openRes(${A[A.length-1].id})">Last result</button>`:''}${r?` <span class="m">Answer key: ${r.st}</span>`:''}</div>`}
 return h}
async function st(s){const{data,error}=await SB.from('questions').select('id,topic,sub,lvl,q,o').eq('topic',sub.topic).eq('sub',sub.sb).eq('lvl',sub.lvl).order('id').range(s*SET,s*SET+SET-1);
 if(error||!data.length){msg='Could not load this set.';R();return}quiz={s,qs:data,a:data.map(()=>-1),i:0};R()}
const pk=j=>{quiz.a[quiz.i]=j;R()};
const nv=d=>{quiz.i=Math.max(0,Math.min(quiz.qs.length-1,quiz.i+d));R()};
function quizV(){const q=quiz.qs[quiz.i],a=quiz.a;
 return `<div class="card"><div class="row"><b>Question ${quiz.i+1} of ${quiz.qs.length}</b><span class="m">${esc(q.topic)} · ${q.lvl}</span></div><p>${esc(q.q)}</p>${q.o.map((o,j)=>`<button class="opt${a[quiz.i]===j?' sel':''}" onclick="pk(${j})">${'ABCD'[j]}) ${esc(o)}</button>`).join('')}<div class="row"><button class="btn s" onclick="nv(-1)">Previous</button><button class="btn s" onclick="nv(1)">Next</button></div></div><div class="card"><div class="grid">${quiz.qs.map((_,k)=>`<button class="num${a[k]>=0?' dn':''}${k===quiz.i?' cur':''}" onclick="nv(${k}-quiz.i)">${k+1}</button>`).join('')}</div><button class="btn" onclick="fin()">Submit set (${a.filter(x=>x>=0).length}/${quiz.qs.length} answered)</button></div>`}
async function fin(){const qs=quiz.qs,t=qs[0];
 const{data,error}=await SB.rpc('submit_attempt',{p_topic:t.topic,p_sub:t.sub,p_lvl:t.lvl,p_set:quiz.s,p_qids:qs.map(q=>q.id),p_ans:quiz.a});
 if(error){msg=error.message;R();return}
 quiz=null;await load();sub={topic:t.topic,sb:t.sub,lvl:t.lvl};await openRes(data.id)}
async function ask(id){const a=DB.at.find(x=>x.id===id),{error}=await SB.from('key_requests').insert({topic:a.topic,sub:a.sb,lvl:a.lvl,set_no:a.set});
 msg=error?'You already have a pending request for this set.':'Request sent to the admin.';await load();await openRes(id)}
const reqOf=at=>DB.rq.filter(x=>x.u===me.u&&x.topic===at.topic&&x.sb===at.sb&&x.lvl===at.lvl&&x.set===at.set).pop();
async function openRes(id){const at=DB.at.find(a=>a.id===id),r=reqOf(at),KY={};
 const{data:Q}=await SB.from('questions').select('id,q,o').in('id',at.qids);
 const{data:res}=await SB.rpc('attempt_results',{p_id:id});
 if(r&&r.st==='approved'){const{data:K}=await SB.rpc('get_answer_key',{p_topic:at.topic,p_sub:at.sb,p_lvl:at.lvl,p_set:at.set});(K||[]).forEach(k=>KY[k.question_id]=k)}
 sub.res=id;sub.rd={Q:at.qids.map(i=>(Q||[]).find(q=>q.id===i)),res:res||[],KY};R()}
function resV(){const at=DB.at.find(a=>a.id===sub.res),{Q,res,KY}=sub.rd,r=reqOf(at),ok=r&&r.st==='approved',p=Math.round(at.score/at.total*100);
 return `<button class="btn s" onclick="sub.res=null;sub.rd=null;R()">Back to sets</button><div class="card"><h2>${at.score}/${at.total} (${p}%)</h2><p class="m">${esc(at.sb)} · ${at.lvl} · Set ${at.set+1}</p>${ok?'<p>Answer key unlocked.</p>':!r?`<button class="btn" onclick="ask(${at.id})">Request answer key</button>`:`<p class="m">Answer key: ${r.st}</p>${r.st==='rejected'?`<button class="btn" onclick="ask(${at.id})">Request again</button>`:''}`}</div>`+Q.map((q,k)=>{if(!q)return '';const kk=KY[q.id];return `<div class="card"><b>${k+1}. ${res[k]?'Right':'Wrong'}</b> ${esc(q.q)}${ok&&kk?`<p>Correct: <b>${'ABCD'[kk.a]}) ${esc(q.o[kk.a])}</b> · Your answer: ${at.ans[k]>=0?'ABCD'[at.ans[k]]:'none'}</p>${kk.e?`<p class="m">${esc(kk.e)}</p>`:''}`:''}</div>`}).join('')}
function progV(){const g={},mine=DB.at.filter(a=>a.u===me.u);mine.forEach(a=>{const k=(a.sb||a.topic)+' · '+a.lvl;(g[k]=g[k]||[]).push(Math.round(a.score/a.total*100))});
 const E=Object.entries(g).map(([k,v])=>[k,v.length,Math.round(v.reduce((x,y)=>x+y,0)/v.length),Math.max(...v)]).sort((a,b)=>a[2]-b[2]);
 return `<div class="card"><b>${mine.length} attempts</b><p class="m">Weakest topics come first.</p></div>`+(E.map(e=>`<div class="card"><div class="row"><b>${esc(e[0])}</b><span class="m">${e[1]} attempts · best ${e[3]}%</span></div><div class="bar"><i style="width:${e[2]}%"></i></div><small class="m">Average ${e[2]}%</small></div>`).join('')||'<div class="card">Finish a set to see your progress.</div>')}
function ntV(){const L=DB.nt,un=L.filter(n=>!DB.rd.includes(n.id));
 if(un.length){SB.from('notification_reads').upsert(un.map(n=>({notification_id:n.id})),{onConflict:'user_id,notification_id',ignoreDuplicates:true}).then(()=>{DB.rd=DB.rd.concat(un.map(n=>n.id))})}
 return L.map(n=>`<div class="card"><b>${esc(n.t)}</b><p>${esc(n.b||'')}</p><small class="m">${new Date(n.ts).toLocaleString()}</small></div>`).join('')||'<div class="card">No alerts yet.</div>'}
function chatV(){const adm=me.role==='admin',th=adm?sub.th:me.id;
 if(adm&&!th){const U=DB.users.map((u,i)=>[u,i]).filter(x=>x[0].role!=='admin');return `<div class="card"><b>Student chats</b>${U.map(([u,i])=>{const l=DB.ms.filter(m=>m.th===u.id).pop();return `<div class="row"><button class="btn s" onclick="sub.th=DB.users[${i}].id;R()">${esc(u.u)}</button><span class="m">${l?esc(l.body.slice(0,40)):'No messages'}</span></div>`}).join('')||'<p class="m">No students yet.</p>'}</div>`}
 const nm=adm?(DB.users.find(u=>u.id===th)||{}).u:'';
 return `${adm?'<button class="btn s" onclick="sub={};R()">All chats</button>':''}<div class="card"><b>${adm?esc(nm):'Ask the admin'}</b><div class="chat">${DB.ms.filter(m=>m.th===th).map(m=>`<div class="msg${m.from===me.id?' me':''}">${esc(m.body)}</div>`).join('')||'<p class="m">No messages yet. Ask your doubt below.</p>'}</div><input id="cm" placeholder="Type a message" maxlength="1000"><button class="btn" onclick="snd()">Send</button></div>`}
async function snd(){const b=$('#cm').value.trim(),th=me.role==='admin'?sub.th:me.id;if(!b)return;
 const{error}=await SB.from('messages').insert({thread_user:th,body:b});
 if(!error&&me.role==='admin')await SB.from('notifications').insert({to_user:th,title:'New reply from admin',body:b.slice(0,60)});
 await load();R()}
function R(){let h;if(!me)h=loginV();else{h=head();
 if(me.role==='admin')h+={add:addV,users:usersV,req:reqV,chat:chatV,ann:annV,acc:accV}[tab]();
 else h+={prac:pracV,prog:progV,chat:chatV,nt:ntV,acc:accV}[tab]()}
 $('#app').innerHTML=h;window.scrollTo(0,0)}
(async()=>{const{data:{session}}=await SB.auth.getSession();if(session)await boot(session.user.id);else R()})();
</script></body></html>
